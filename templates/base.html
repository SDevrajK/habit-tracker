<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Habit Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <a href="{{ url_for('dashboard.today_view') }}" class="nav-link">Today</a>
    <a href="{{ url_for('dashboard.heatmap_view') }}" class="nav-link">Heatmap</a>
    <a href="{{ url_for('dashboard.calendar_view') }}" class="nav-link">Calendar</a>
    <a href="{{ url_for('dashboard.habits_view') }}" class="nav-link">Habits</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='charts.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
